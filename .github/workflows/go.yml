name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GOPRIVATE: github.com/lemongoff/*

jobs:
  changed-whitespace:
    name: Changed whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

  test-linux:
    name: Root module (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # This read-only secret must cover both hexas and hexas-config.
      # Environment-based Git config also applies inside Go's module cache.
      - name: Configure private module access
        shell: bash
        env:
          HEXAS_MODULES_TOKEN: ${{ secrets.HEXAS_MODULES_TOKEN }}
        run: |
          if [ -z "$HEXAS_MODULES_TOKEN" ]; then
            echo "::error::HEXAS_MODULES_TOKEN is required to download private Go modules."
            exit 1
          fi
          module_auth=$(printf 'x-access-token:%s' "$HEXAS_MODULES_TOKEN" | base64 | tr -d '\r\n')
          echo "::add-mask::$module_auth"
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/lemongoff/.extraheader'
            printf 'GIT_CONFIG_VALUE_0=AUTHORIZATION: basic %s\n' "$module_auth"
          } >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-goctl:
    name: goctl module (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/goctl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure private module access
        shell: bash
        env:
          HEXAS_MODULES_TOKEN: ${{ secrets.HEXAS_MODULES_TOKEN }}
        run: |
          if [ -z "$HEXAS_MODULES_TOKEN" ]; then
            echo "::error::HEXAS_MODULES_TOKEN is required to download private Go modules."
            exit 1
          fi
          module_auth=$(printf 'x-access-token:%s' "$HEXAS_MODULES_TOKEN" | base64 | tr -d '\r\n')
          echo "::add-mask::$module_auth"
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/lemongoff/.extraheader'
            printf 'GIT_CONFIG_VALUE_0=AUTHORIZATION: basic %s\n' "$module_auth"
          } >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/goctl/go.mod
          cache: true
          cache-dependency-path: tools/goctl/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Install protobuf toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Test
        run: go test ./...

  test-win:
    name: Root module (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Configure private module access
        shell: bash
        env:
          HEXAS_MODULES_TOKEN: ${{ secrets.HEXAS_MODULES_TOKEN }}
        run: |
          if [ -z "$HEXAS_MODULES_TOKEN" ]; then
            echo "::error::HEXAS_MODULES_TOKEN is required to download private Go modules."
            exit 1
          fi
          module_auth=$(printf 'x-access-token:%s' "$HEXAS_MODULES_TOKEN" | base64 | tr -d '\r\n')
          echo "::add-mask::$module_auth"
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/lemongoff/.extraheader'
            printf 'GIT_CONFIG_VALUE_0=AUTHORIZATION: basic %s\n' "$module_auth"
          } >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go mod verify
          go test ./...
